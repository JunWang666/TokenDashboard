name = "tokendash-runner"
main = "src/index.ts"
compatibility_date = "2026-08-01"

crons = ["*/15 * * * *"]

# 环境变量 / secrets：
#   HUB_URL                 hub 地址，如 https://hub.example.com
#   HUB_DEV_TOKEN           本地开发令牌（连本地 hub 时用；生产不配置）
#   CF_ACCESS_CLIENT_ID     runner service token id（wrangler secret put）
#   CF_ACCESS_CLIENT_SECRET runner service token secret（wrangler secret put）
#   PROVIDERS               可选，逗号分隔白名单，如 "openai,deepseek"；空 = 全部

[vars]
HUB_URL = "http://localhost:8787"

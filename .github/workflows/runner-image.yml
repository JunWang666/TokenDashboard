name: runner-image

# runner/ 有改动（或手动触发）时构建并推送 ghcr.io/<owner>/tokendash-runner
on:
  push:
    branches: [main]
    paths: [runner/**, .github/workflows/runner-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/tokendash-runner
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # NAS 常见 arm64、VPS 常见 amd64，两个架构都出
      - uses: docker/build-push-action@v6
        with:
          context: ./runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: ios-testflight

run-name: iOS build for ${{ github.ref_name }}

on:
  push:
    branches:
      - "**"
    paths:
      - iOS/**
      - .github/workflows/ios-testflight.yml
  pull_request:
    paths:
      - iOS/**
      - .github/workflows/ios-testflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PROJECT_PATH: iOS/TokenDashboard/TokenDashboard.xcodeproj
  SCHEME: TokenDashboard
  ARCHIVE_PATH: .build/Archives/TokenDashboard.xcarchive
  EXPORT_PATH: .build/Artifacts/TokenDashboard
  EXPORT_OPTIONS_PATH: iOS/TokenDashboard/ExportOptions.plist

jobs:
  build:
    name: Build iOS and publish main to TestFlight
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Build for iOS Simulator
        uses: Apple-Actions/xcodebuild@v1
        with:
          project: ${{ env.PROJECT_PATH }}
          scheme: ${{ env.SCHEME }}
          configuration: Debug
          sdk: iphonesimulator
          destination: generic/platform=iOS Simulator
          action: build
          derived-data-path: .build/DerivedData-Simulator
          result-bundle-path: .build/Artifacts/Simulator.xcresult
          log-path: .build/logs/simulator.log
          build-number: ${{ github.run_id }}.${{ github.run_attempt }}

      - name: Check TestFlight credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          missing=0
          for name in \
            APPSTORE_ISSUER_ID \
            APPSTORE_API_KEY_ID \
            APPSTORE_API_PRIVATE_KEY \
            APPSTORE_CERTIFICATES_FILE_BASE64 \
            APPSTORE_CERTIFICATES_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions variable or secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import App Store signing certificate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download main app provisioning profile
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.gouzuang.TokenDashboard
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Download Widget provisioning profile
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.gouzuang.TokenDashboard.Widget
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Download App Clip provisioning profile
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.gouzuang.TokenDashboard.Clip
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Archive signed iOS app
        id: archive
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: Apple-Actions/xcodebuild@v1
        with:
          project: ${{ env.PROJECT_PATH }}
          scheme: ${{ env.SCHEME }}
          configuration: Release
          sdk: iphoneos
          destination: generic/platform=iOS
          action: archive
          archive-path: ${{ env.ARCHIVE_PATH }}
          export-options-plist: ${{ env.EXPORT_OPTIONS_PATH }}
          export-path: ${{ env.EXPORT_PATH }}
          derived-data-path: .build/DerivedData-Archive
          result-bundle-path: .build/Artifacts/Archive.xcresult
          log-path: .build/logs/archive.log
          build-number: ${{ github.run_id }}.${{ github.run_attempt }}

      - name: Upload build to TestFlight
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.archive.outputs.ipa-path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: "false"
          wait-for-processing: "true"

      - name: Upload build diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .build/logs/
            .build/Artifacts/*.xcresult

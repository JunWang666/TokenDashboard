name = "tokendash-hub"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# 环境变量（也可在 Cloudflare dashboard 配置）：
#   ACCESS_TEAM          Zero Trust team 名，如 "my-team"（用于拉取 https://<team>.cloudflareaccess.com/cdn-cgi/access/certs）
#   ACCESS_AUD           hub Access App 的 AUD tag，JWT 校验用
#   CREDENTIALS_KEY      AES-256-GCM 凭证加密密钥（32 字节 base64），必须用 `wrangler secret put`
#   RUNNER_SERVICE_TOKENS runner 的 service token 名（逗号分隔），默认 "tokendash-runner"
#   CORS_ORIGINS         web 前端允许的来源（逗号分隔）；未设置时反射任意来源（个人使用默认）
#   DEV_TOKEN            本地开发令牌（仅非生产环境），格式见 README

[[d1_databases]]
binding = "DB"
database_name = "tokendash"
database_id = "REPLACE_WITH_D1_DATABASE_ID" # wrangler d1 create tokendash 后回填
migrations_dir = "migrations"

[vars]
ACCESS_TEAM = "your-team"
ACCESS_AUD = "REPLACE_WITH_ACCESS_APP_AUD"
RUNNER_SERVICE_TOKENS = "tokendash-runner"

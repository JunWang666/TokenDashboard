name = "tokendash-hub"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false

# 三合一部署：本 Worker = 静态前端（web/dist）+ /api/*（hub）+ cron 采集（runner）

[triggers]
crons = ["*/15 * * * *"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 环境变量（也可在 Cloudflare dashboard 配置）：
#   ACCESS_TEAM          Zero Trust team 名，如 "my-team"（用于拉取 https://<team>.cloudflareaccess.com/cdn-cgi/access/certs）
#   ACCESS_AUD           hub Access App 的 AUD tag，JWT 校验用
#   CREDENTIALS_KEY      AES-256-GCM 凭证加密密钥（32 字节 base64），必须用 `wrangler secret put`
#   RUNNER_SERVICE_TOKENS runner 的 service token client_id（逗号分隔；JWT common_name 是 client_id 而非显示名），默认 "tokendash-runner"
#   CORS_ORIGINS         web 前端允许的来源（逗号分隔）；未设置时反射任意来源（个人使用默认）
#   DEV_TOKEN            本地开发令牌（仅非生产环境），格式见 README

[[d1_databases]]
binding = "DB"
database_name = "tokendash"
database_id = "844c898f-9b50-4957-8e0b-49c60a175493"
migrations_dir = "migrations"

[vars]
ACCESS_TEAM = "gouzuang"
ACCESS_AUD = "138aeabac84c1cd9e670ea466c676263b9fd4751129aa765c9e0aebc1a0172c6"
RUNNER_SERVICE_TOKENS = "29d9f8f51ba251fa66ffffe504bc17b8.access"
HUB_URL = "https://token.goudaijun.top"
